name: The New Windows Build Environment

on:
  workflow_dispatch:

concurrency:
  group: rdp-environment
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ۱. تنظیم ریموت دسکتاپ
      - name: 1. Configure System & Remote Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      # ۲. ساخت کاربر و تنظیم دسترسی کامل دسکتاپ‌ها
      - name: 2. Setup Local User & Multi-Profile Folders
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

          # آماده‌سازی پوشه‌های دسکتاپ برای هر دو کاربر
          $profiles = @("C:\Users\CynetAdmin", "C:\Users\runneradmin", "C:\Users\Default")
          foreach ($p in $profiles) {
            New-Item -ItemType Directory -Path "$p\Desktop" -Force | Out-Null
            New-Item -ItemType Directory -Path "$p\Downloads" -Force | Out-Null
            New-Item -ItemType Directory -Path "$p\Documents" -Force | Out-Null
          }
          New-Item -ItemType Directory -Path "C:\MyFiles" -Force | Out-Null

          # ساخت اسکریپت ذخیره فوری روی دسکتاپ عمومی (قابل مشاهده برای همه یوزرها)
          $saveScript = @"
          @echo off
          cls
          echo ===================================================
          echo   Backing up Desktop and Files to Google Drive...
          echo ===================================================
          C:\rclone\rclone.exe copy "%USERPROFILE%\Desktop" "gdrive:RDP_State/Desktop" --exclude "SAVE-NOW.bat" --exclude "desktop.ini" --drive-chunk-size 64M
          C:\rclone\rclone.exe copy "%USERPROFILE%\Documents" "gdrive:RDP_State/Documents" --drive-chunk-size 64M
          C:\rclone\rclone.exe copy "%USERPROFILE%\Downloads" "gdrive:RDP_State/Downloads" --drive-chunk-size 64M
          C:\rclone\rclone.exe copy "C:\MyFiles" "gdrive:RDP_State/MyFiles" --drive-chunk-size 64M
          echo ===================================================
          echo   SUCCESS! Files are 100% saved in Google Drive.
          echo ===================================================
          pause
          "@
          Set-Content -Path "C:\Users\Public\Desktop\SAVE-NOW.bat" -Value $saveScript

      # ۳. راه‌اندازی Rclone
      - name: 3. Initialize Google Drive Storage
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "C:\rclone.zip"
          Expand-Archive -Path "C:\rclone.zip" -DestinationPath "C:\rclone_temp"
          $rcloneDir = Get-ChildItem "C:\rclone_temp" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Move-Item -Path $rcloneDir.FullName -Destination "C:\rclone"

          $confPath = "$env:APPDATA\rclone\rclone.conf"
          New-Item -ItemType File -Path $confPath -Force | Out-Null
          [System.IO.File]::WriteAllBytes($confPath, [System.Convert]::FromBase64String($env:RCLONE_CONF_B64))
          
          Write-Host "Verifying Google Drive connection..." -ForegroundColor Cyan
          & C:\rclone\rclone.exe about gdrive:

      # ۴. بازیابی تضمینی داده‌ها به تمام دسکتاپ‌ها
      - name: 4. Restore Full User State
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Checking for existing files in Google Drive..." -ForegroundColor Cyan

          # ایجاد امن پوشه‌های ریموت
          & C:\rclone\rclone.exe mkdir "gdrive:RDP_State/Desktop" 2>$null
          & C:\rclone\rclone.exe mkdir "gdrive:RDP_State/Documents" 2>$null
          & C:\rclone\rclone.exe mkdir "gdrive:RDP_State/Downloads" 2>$null
          & C:\rclone\rclone.exe mkdir "gdrive:RDP_State/MyFiles" 2>$null
          $LASTEXITCODE = 0

          # دانلود فایل‌ها و ریختن هم‌زمان در دسکتاپ CynetAdmin و runneradmin
          $targetDesktops = @("C:\Users\CynetAdmin\Desktop", "C:\Users\runneradmin\Desktop")
          foreach ($desk in $targetDesktops) {
            & C:\rclone\rclone.exe copy "gdrive:RDP_State/Desktop" "$desk" --transfers 8 --drive-chunk-size 64M 2>$null
            & C:\rclone\rclone.exe copy "gdrive:RDP_State/Documents" "$desk\..\Documents" --transfers 8 --drive-chunk-size 64M 2>$null
            & C:\rclone\rclone.exe copy "gdrive:RDP_State/Downloads" "$desk\..\Downloads" --transfers 8 --drive-chunk-size 64M 2>$null
          }
          & C:\rclone\rclone.exe copy "gdrive:RDP_State/MyFiles" "C:\MyFiles" --transfers 8 --drive-chunk-size 64M 2>$null

          $LASTEXITCODE = 0
          Write-Host "Restoration finished. Files on Desktop:" -ForegroundColor Green
          Get-ChildItem "C:\Users\CynetAdmin\Desktop" | Select-Object Name, Length

      # ۵. راه‌اندازی تونل ثابت Bore + تیل‌اسکیل (اختیاری)
      - name: 5. Connect Permanent Bore Tunnel & Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Setting up Permanent Bore Tunnel..." -ForegroundColor Cyan
          New-Item -ItemType Directory -Path "C:\bore" -Force | Out-Null
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "C:\bore\bore.zip"
          Expand-Archive -Path "C:\bore\bore.zip" -DestinationPath "C:\bore" -Force
          
          Start-Process -FilePath "C:\bore\bore.exe" -ArgumentList "local 3389 --to bore.pub --port 38926" -WorkingDirectory "C:\bore"

          if ($env:TAILSCALE_AUTHKEY) {
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
            Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
            Start-Sleep -Seconds 5
            & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="win-station" --unattended
          }

          Write-Host ""
          Write-Host "=================================================================" -ForegroundColor Green
          Write-Host "  >>> 100% PERMANENT & STATIC RDP IS READY <<<" -ForegroundColor Cyan
          Write-Host "  👉 Fixed Address : bore.pub:38926" -ForegroundColor Yellow
          Write-Host "  👉 Username      : CynetAdmin (یا runneradmin)" -ForegroundColor Yellow
          Write-Host "  👉 Password      : Cynet@2026" -ForegroundColor Yellow
          Write-Host "=================================================================" -ForegroundColor Green

      # ۶. همگام‌سازی خودکار هر ۳ دقیقه در پس‌زمینه
      - name: 6. Keep Alive & Periodic Background Sync (350 Minutes)
        run: |
          $syncMinutes = 3
          $totalMinutes = 350

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60

            if ($i % $syncMinutes -eq 0) {
              Write-Host "[$i/$totalMinutes] Auto-syncing files to Google Drive..." -ForegroundColor Magenta

              # اسکن دسکتاپ تمام کاربران برای اطمینان از ذخیره همه فایل‌ها
              $userDirs = Get-ChildItem "C:\Users" -Directory | Where-Object { $_.Name -notmatch "Public|Default|All Users" }
              foreach ($u in $userDirs) {
                if (Test-Path "$($u.FullName)\Desktop") {
                  & C:\rclone\rclone.exe copy "$($u.FullName)\Desktop" "gdrive:RDP_State/Desktop" --exclude "SAVE-NOW.bat" --exclude "desktop.ini" --drive-chunk-size 64M 2>$null
                }
                if (Test-Path "$($u.FullName)\Documents") {
                  & C:\rclone\rclone.exe copy "$($u.FullName)\Documents" "gdrive:RDP_State/Documents" --drive-chunk-size 64M 2>$null
                }
                if (Test-Path "$($u.FullName)\Downloads") {
                  & C:\rclone\rclone.exe copy "$($u.FullName)\Downloads" "gdrive:RDP_State/Downloads" --drive-chunk-size 64M 2>$null
                }
              }
              & C:\rclone\rclone.exe copy "C:\MyFiles" "gdrive:RDP_State/MyFiles" --drive-chunk-size 64M 2>$null
              $LASTEXITCODE = 0
            } else {
              Write-Host "[$i/$totalMinutes] System running smoothly..."
            }
          }

      # ۷. بکاپ نهایی در لحظه لغو یا خاموشی
      - name: 7. Final State Backup to Google Drive
        if: always()
        run: |
          Write-Host "Executing Final State Commit to Google Drive..." -ForegroundColor Cyan

          $userDirs = Get-ChildItem "C:\Users" -Directory | Where-Object { $_.Name -notmatch "Public|Default|All Users" }
          foreach ($u in $userDirs) {
            if (Test-Path "$($u.FullName)\Desktop") {
              & C:\rclone\rclone.exe copy "$($u.FullName)\Desktop" "gdrive:RDP_State/Desktop" --exclude "SAVE-NOW.bat" --exclude "desktop.ini" --drive-chunk-size 64M 2>$null
            }
            if (Test-Path "$($u.FullName)\Documents") {
              & C:\rclone\rclone.exe copy "$($u.FullName)\Documents" "gdrive:RDP_State/Documents" --drive-chunk-size 64M 2>$null
            }
            if (Test-Path "$($u.FullName)\Downloads") {
              & C:\rclone\rclone.exe copy "$($u.FullName)\Downloads" "gdrive:RDP_State/Downloads" --drive-chunk-size 64M 2>$null
            }
          }
          & C:\rclone\rclone.exe copy "C:\MyFiles" "gdrive:RDP_State/MyFiles" --drive-chunk-size 64M 2>$null

          $LASTEXITCODE = 0
          Write-Host "All files committed to Google Drive successfully." -ForegroundColor Green

      # ۸. خروج ایمن از تیل‌اسکیل
      - name: 8. Immediate Tailscale Logout
        if: always()
        run: |
          if (Test-Path "C:\Program Files\Tailscale\tailscale.exe") {
            try { & "C:\Program Files\Tailscale\tailscale.exe" logout } catch {}
          }

      # ۹. اجرای خودکار سشن بعدی
      - name: 9. Trigger Next Run (Auto-Restart)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if ($env:GH_TOKEN) {
            Write-Host "Starting next continuous session..." -ForegroundColor Cyan
            gh workflow run "windows-rdp.yml" --repo $env:GITHUB_REPOSITORY --ref main
          }
