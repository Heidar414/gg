name: Windows Build Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Configure System & Remote Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Setup Local User
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 3. Setup Persistent Storage & Rclone Backup
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          # ایجاد پوشه کاربری روی دسکتاپ
          $folder = "C:\Users\CynetAdmin\Desktop\MyFiles"
          New-Item -ItemType Directory -Path $folder -Force

          # دانلود و پیکربندی ابزار همگام‌سازی ابری Rclone
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "C:\rclone.zip"
          Expand-Archive -Path "C:\rclone.zip" -DestinationPath "C:\rclone_temp"
          $rcloneDir = Get-ChildItem "C:\rclone_temp" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Move-Item -Path $rcloneDir.FullName -Destination "C:\rclone"

          if ($env:MEGA_EMAIL -and $env:MEGA_PASSWORD) {
            $configPath = "$env:APPDATA\rclone\rclone.conf"
            New-Item -ItemType File -Path $configPath -Force
            @"
[mycloud]
type = mega
user = $env:MEGA_EMAIL
pass = $(& C:\rclone\rclone.exe obscure $env:MEGA_PASSWORD)
"@ | Set-Content -Path $configPath

            Write-Host "Restoring files from cloud backup..." -ForegroundColor Cyan
            & C:\rclone\rclone.exe copy "mycloud:ServerBackup" "C:\Users\CynetAdmin\Desktop\MyFiles" --create-empty-src-dirs
          } else {
            Write-Host "Cloud credentials not set. Files will only be local." -ForegroundColor Yellow
          }

      - name: 4. Connect Tailscale Network
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          Start-Sleep -Seconds 5
          # نام ثابت دستگاه را win-station گذاشتیم
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="win-station"

          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> SERVER IS READY <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale Hostname : win-station" -ForegroundColor Yellow
          Write-Host "  Tailscale IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username           : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password           : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  Folder to Save     : Desktop\MyFiles" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 5. Keep Alive & Background Sync (350 Minutes)
        run: |
          $syncIntervalMinutes = 10
          $totalMinutes = 350

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60

            if ($i % $syncIntervalMinutes -eq 0) {
              if (Test-Path "C:\rclone\rclone.exe") {
                & C:\rclone\rclone.exe sync "C:\Users\CynetAdmin\Desktop\MyFiles" "mycloud:ServerBackup" --fast-list
              }
            } else {
              Write-Host "[$i/$totalMinutes] Environment active..."
            }
          }

      - name: 6. Final Cloud Backup
        if: always()
        run: |
          Write-Host "Syncing final files before shutdown..." -ForegroundColor Cyan
          if (Test-Path "C:\rclone\rclone.exe") {
            & C:\rclone\rclone.exe sync "C:\Users\CynetAdmin\Desktop\MyFiles" "mycloud:ServerBackup" --fast-list
          }

      - name: 7. Immediate Tailscale Logout (Free Hostname)
        if: always()
        run: |
          Write-Host "Releasing Tailscale hostname..." -ForegroundColor Yellow
          if (Test-Path "C:\Program Files\Tailscale\tailscale.exe") {
            & "C:\Program Files\Tailscale\tailscale.exe" logout
          }

      - name: 8. Trigger Next Run (Auto-Restart)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          Write-Host "Queueing next run..." -ForegroundColor Cyan
          # نام فایل yml را مطابق با نامی که در گیت‌هاب ذخیره کردید وارد کنید:
          gh workflow run "build-env.yml" --ref main
