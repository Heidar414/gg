name: The New Windows Build Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Configure System & Remote Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Setup Local User
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 3. Create Storage Folder
        run: |
          New-Item -ItemType Directory -Path "C:\Users\CynetAdmin\Desktop\MyFiles" -Force

      # مرحله بازیابی فایل‌های قبلی با کش پرسرعت گیت‌هاب
      - name: 4. Restore Cached Files
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\CynetAdmin\Desktop\MyFiles
          key: storage-${{ github.run_id }}
          restore-keys: |
            storage-

      - name: 5. Connect Tailscale Network
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="win-station"

          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> SERVER IS READY <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale Hostname : win-station" -ForegroundColor Yellow
          Write-Host "  Tailscale IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username           : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password           : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  Storage Folder     : Desktop\MyFiles (Auto-Cached)" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 6. Keep Alive (350 Minutes)
        run: |
          for ($i = 1; $i -le 350; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/350] Server running..."
          }

      # ذخیره خودکار فایل‌های جدید در کش گیت‌هاب قبل از خاموشی
      - name: 7. Save Files to Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Users\CynetAdmin\Desktop\MyFiles
          key: storage-${{ github.run_id }}

      - name: 8. Immediate Tailscale Logout
        if: always()
        run: |
          Write-Host "Releasing Tailscale hostname..." -ForegroundColor Yellow
          if (Test-Path "C:\Program Files\Tailscale\tailscale.exe") {
            & "C:\Program Files\Tailscale\tailscale.exe" logout
          }

      - name: 9. Trigger Next Run (Auto-Restart)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          Write-Host "Queueing next run..." -ForegroundColor Cyan
          gh workflow run "windows-rdp.yml" --repo $env:GITHUB_REPOSITORY --ref main
