name: The New Windows Build Environment

on:
  workflow_dispatch:

concurrency:
  group: rdp-environment
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ۱. تنظیم ریموت دسکتاپ
      - name: 1. Configure System & Remote Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      # ۲. ساخت کاربر
      - name: 2. Setup Local User
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

          New-Item -ItemType Directory -Path "C:\MyFiles" -Force | Out-Null

      # ۳. دانلود و راه‌اندازی Rclone در مسیر عمومی C:\rclone (دسترسی همگانی)
      - name: 3. Initialize Global Google Drive Storage
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "C:\rclone.zip"
          Expand-Archive -Path "C:\rclone.zip" -DestinationPath "C:\rclone_temp"
          $rcloneDir = Get-ChildItem "C:\rclone_temp" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Move-Item -Path $rcloneDir.FullName -Destination "C:\rclone"

          # قرار دادن فایل کانفیگ در مسیر ریشه و عمومی C:\rclone\rclone.conf
          $globalConf = "C:\rclone\rclone.conf"
          New-Item -ItemType File -Path $globalConf -Force | Out-Null
          [System.IO.File]::WriteAllBytes($globalConf, [System.Convert]::FromBase64String($env:RCLONE_CONF_B64))

          # ثبت متغیر محیطی سیستمی تا هر کاربری rclone را زد، کانفیگ را بشناسد
          [System.Environment]::SetEnvironmentVariable("RCLONE_CONFIG", $globalConf, "Machine")
          $env:RCLONE_CONFIG = $globalConf

          Write-Host "Verifying Google Drive connection..." -ForegroundColor Cyan
          & C:\rclone\rclone.exe --config $globalConf about gdrive:

      # ۴. ایجاد فایل ذخیره سریع در دسکتاپ عمومی با آدرس مستقیم کانفیگ
      - name: 4. Setup Desktop Save Shortcut
        run: |
          $saveScript = @"
          @echo off
          cls
          echo ===================================================
          echo   Backing up Desktop and Files to Google Drive...
          echo ===================================================
          C:\rclone\rclone.exe --config "C:\rclone\rclone.conf" copy "%USERPROFILE%\Desktop" "gdrive:RDP_State/Desktop" --exclude "SAVE-NOW.bat" --exclude "desktop.ini" --drive-chunk-size 64M
          C:\rclone\rclone.exe --config "C:\rclone\rclone.conf" copy "%USERPROFILE%\Documents" "gdrive:RDP_State/Documents" --drive-chunk-size 64M
          C:\rclone\rclone.exe --config "C:\rclone\rclone.conf" copy "%USERPROFILE%\Downloads" "gdrive:RDP_State/Downloads" --drive-chunk-size 64M
          C:\rclone\rclone.exe --config "C:\rclone\rclone.conf" copy "C:\MyFiles" "gdrive:RDP_State/MyFiles" --drive-chunk-size 64M
          echo ===================================================
          echo   SUCCESS! Files are 100%% saved in Google Drive.
          echo ===================================================
          pause
          "@
          Set-Content -Path "C:\Users\Public\Desktop\SAVE-NOW.bat" -Value $saveScript

      # ۵. بازیابی فایل‌ها از گوگل درایو
      - name: 5. Restore Full User State
        run: |
          $ErrorActionPreference = "Continue"
          $globalConf = "C:\rclone\rclone.conf"
          Write-Host "Checking for existing files in Google Drive..." -ForegroundColor Cyan

          & C:\rclone\rclone.exe --config $globalConf mkdir "gdrive:RDP_State/Desktop" 2>$null
          & C:\rclone\rclone.exe --config $globalConf mkdir "gdrive:RDP_State/Documents" 2>$null
          & C:\rclone\rclone.exe --config $globalConf mkdir "gdrive:RDP_State/Downloads" 2>$null
          & C:\rclone\rclone.exe --config $globalConf mkdir "gdrive:RDP_State/MyFiles" 2>$null
          $LASTEXITCODE = 0

          # دانلود روی تمام پروفایل‌های موجود
          $userDirs = Get-ChildItem "C:\Users" -Directory | Where-Object { $_.Name -notmatch "Public|Default|All Users" }
          foreach ($u in $userDirs) {
            New-Item -ItemType Directory -Path "$($u.FullName)\Desktop" -Force | Out-Null
            & C:\rclone\rclone.exe --config $globalConf copy "gdrive:RDP_State/Desktop" "$($u.FullName)\Desktop" --transfers 8 --drive-chunk-size 64M 2>$null
            & C:\rclone\rclone.exe --config $globalConf copy "gdrive:RDP_State/Documents" "$($u.FullName)\Documents" --transfers 8 --drive-chunk-size 64M 2>$null
            & C:\rclone\rclone.exe --config $globalConf copy "gdrive:RDP_State/Downloads" "$($u.FullName)\Downloads" --transfers 8 --drive-chunk-size 64M 2>$null
          }
          & C:\rclone\rclone.exe --config $globalConf copy "gdrive:RDP_State/MyFiles" "C:\MyFiles" --transfers 8 --drive-chunk-size 64M 2>$null

          $LASTEXITCODE = 0
          Write-Host "Restoration step completed." -ForegroundColor Green

      # ۶. راه‌اندازی تونل ثابت Bore + تیل‌اسکیل (اختیاری)
      - name: 6. Connect Permanent Bore Tunnel & Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Setting up Permanent Bore Tunnel..." -ForegroundColor Cyan
          New-Item -ItemType Directory -Path "C:\bore" -Force | Out-Null
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "C:\bore\bore.zip"
          Expand-Archive -Path "C:\bore\bore.zip" -DestinationPath "C:\bore" -Force
          
          Start-Process -FilePath "C:\bore\bore.exe" -ArgumentList "local 3389 --to bore.pub --port 38926" -WorkingDirectory "C:\bore"

          if ($env:TAILSCALE_AUTHKEY) {
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
            Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
            Start-Sleep -Seconds 5
            & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="win-station" --unattended
          }

          Write-Host ""
          Write-Host "=================================================================" -ForegroundColor Green
          Write-Host "  >>> 100% PERMANENT & STATIC RDP IS READY <<<" -ForegroundColor Cyan
          Write-Host "  👉 Fixed Address : bore.pub:38926" -ForegroundColor Yellow
          Write-Host "  👉 Username      : CynetAdmin (یا runneradmin)" -ForegroundColor Yellow
          Write-Host "  👉 Password      : Cynet@2026" -ForegroundColor Yellow
          Write-Host "=================================================================" -ForegroundColor Green

      # ۷. همگام‌سازی خودکار هر ۳ دقیقه
      - name: 7. Keep Alive & Periodic Background Sync (350 Minutes)
        run: |
          $globalConf = "C:\rclone\rclone.conf"
          $syncMinutes = 3
          $totalMinutes = 350

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60

            if ($i % $syncMinutes -eq 0) {
              Write-Host "[$i/$totalMinutes] Auto-syncing files to Google Drive..." -ForegroundColor Magenta

              $userDirs = Get-ChildItem "C:\Users" -Directory | Where-Object { $_.Name -notmatch "Public|Default|All Users" }
              foreach ($u in $userDirs) {
                if (Test-Path "$($u.FullName)\Desktop") {
                  & C:\rclone\rclone.exe --config $globalConf copy "$($u.FullName)\Desktop" "gdrive:RDP_State/Desktop" --exclude "SAVE-NOW.bat" --exclude "desktop.ini" --drive-chunk-size 64M 2>$null
                }
                if (Test-Path "$($u.FullName)\Documents") {
                  & C:\rclone\rclone.exe --config $globalConf copy "$($u.FullName)\Documents" "gdrive:RDP_State/Documents" --drive-chunk-size 64M 2>$null
                }
                if (Test-Path "$($u.FullName)\Downloads") {
                  & C:\rclone\rclone.exe --config $globalConf copy "$($u.FullName)\Downloads" "gdrive:RDP_State/Downloads" --drive-chunk-size 64M 2>$null
                }
              }
              & C:\rclone\rclone.exe --config $globalConf copy "C:\MyFiles" "gdrive:RDP_State/MyFiles" --drive-chunk-size 64M 2>$null
              $LASTEXITCODE = 0
            } else {
              Write-Host "[$i/$totalMinutes] System running smoothly..."
            }
          }

      # ۸. بکاپ نهایی در لحظه لغو یا خاموشی
      - name: 8. Final State Backup to Google Drive
        if: always()
        run: |
          Write-Host "Executing Final State Commit to Google Drive..." -ForegroundColor Cyan
          $globalConf = "C:\rclone\rclone.conf"

          $userDirs = Get-ChildItem "C:\Users" -Directory | Where-Object { $_.Name -notmatch "Public|Default|All Users" }
          foreach ($u in $userDirs) {
            if (Test-Path "$($u.FullName)\Desktop") {
              & C:\rclone\rclone.exe --config $globalConf copy "$($u.FullName)\Desktop" "gdrive:RDP_State/Desktop" --exclude "SAVE-NOW.bat" --exclude "desktop.ini" --drive-chunk-size 64M 2>$null
            }
            if (Test-Path "$($u.FullName)\Documents") {
              & C:\rclone\rclone.exe --config $globalConf copy "$($u.FullName)\Documents" "gdrive:RDP_State/Documents" --drive-chunk-size 64M 2>$null
            }
            if (Test-Path "$($u.FullName)\Downloads") {
              & C:\rclone\rclone.exe --config $globalConf copy "$($u.FullName)\Downloads" "gdrive:RDP_State/Downloads" --drive-chunk-size 64M 2>$null
            }
          }
          & C:\rclone\rclone.exe --config $globalConf copy "C:\MyFiles" "gdrive:RDP_State/MyFiles" --drive-chunk-size 64M 2>$null

          $LASTEXITCODE = 0
          Write-Host "All files committed to Google Drive successfully." -ForegroundColor Green

      # ۹. خروج ایمن از تیل‌اسکیل
      - name: 9. Immediate Tailscale Logout
        if: always()
        run: |
          if (Test-Path "C:\Program Files\Tailscale\tailscale.exe") {
            try { & "C:\Program Files\Tailscale\tailscale.exe" logout } catch {}
          }

      # ۱۰. راه‌اندازی مجدد سشن بعدی
      - name: 10. Trigger Next Run (Auto-Restart)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if ($env:GH_TOKEN) {
            Write-Host "Starting next continuous session..." -ForegroundColor Cyan
            gh workflow run "windows-rdp.yml" --repo $env:GITHUB_REPOSITORY --ref main
          }
