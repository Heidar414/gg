name: The New Windows Build Environment

on:
  workflow_dispatch:

concurrency:
  group: rdp-environment
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ۱. تنظیم دسترسی ریموت دسکتاپ (RDP)
      - name: 1. Configure System & Remote Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      # ۲. ایجاد کاربر و ثبت رسمی مسیر پروفایل در رجیستری برای جلوگیری از پروفایل موقت (TEMP)
      - name: 2. Setup Local User & Profile Registration
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

          $userProfile = "C:\Users\CynetAdmin"
          New-Item -ItemType Directory -Path "$userProfile\Desktop" -Force | Out-Null
          New-Item -ItemType Directory -Path "$userProfile\Downloads" -Force | Out-Null
          New-Item -ItemType Directory -Path "$userProfile\Documents" -Force | Out-Null
          New-Item -ItemType Directory -Path "C:\MyFiles" -Force | Out-Null

          try {
            $userObj = New-Object System.Security.Principal.NTAccount("CynetAdmin")
            $sid = $userObj.Translate([System.Security.Principal.SecurityIdentifier]).Value
            $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
            New-Item -Path $profileKey -Force | Out-Null
            Set-ItemProperty -Path $profileKey -Name "ProfileImagePath" -Value $userProfile
            Set-ItemProperty -Path $profileKey -Name "Flags" -Value 0
            Set-ItemProperty -Path $profileKey -Name "State" -Value 0
            icacls $userProfile /grant "CynetAdmin:(OI)(CI)F" /T /Q | Out-Null
            Write-Host "Profile path permanently linked to CynetAdmin." -ForegroundColor Green
          } catch {
            Write-Host "Profile registration notice: $_" -ForegroundColor Yellow
          }

      # ۳. دانلود و راه‌اندازی ابزار Rclone برای اتصال به گوگل درایو
      - name: 3. Initialize Google Drive Storage
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "C:\rclone.zip"
          Expand-Archive -Path "C:\rclone.zip" -DestinationPath "C:\rclone_temp"
          $rcloneDir = Get-ChildItem "C:\rclone_temp" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Move-Item -Path $rcloneDir.FullName -Destination "C:\rclone"

          $confPath = "$env:APPDATA\rclone\rclone.conf"
          New-Item -ItemType File -Path $confPath -Force | Out-Null
          [System.IO.File]::WriteAllBytes($confPath, [System.Convert]::FromBase64String($env:RCLONE_CONF_B64))
          
          Write-Host "Verifying Google Drive connection..." -ForegroundColor Cyan
          & C:\rclone\rclone.exe about gdrive:

      # ۴. بازیابی هوشمند داده‌ها (تشخیص اجرای اول و بدون خطا)
      - name: 4. Restore Full User State
        run: |
          Write-Host "Checking for existing backup in Google Drive..." -ForegroundColor Cyan
          $userProfile = "C:\Users\CynetAdmin"

          # بررسی وجود پوشه‌های بکاپ در گوگل درایو
          $existingFolders = & C:\rclone\rclone.exe lsd "gdrive:RDP_State" 2>$null
          $LASTEXITCODE = 0

          if ($existingFolders) {
            Write-Host "Previous backup detected! Restoring files..." -ForegroundColor Green

            if ($existingFolders -match "Desktop") {
              Write-Host "Restoring Desktop..." -ForegroundColor Green
              & C:\rclone\rclone.exe copy "gdrive:RDP_State/Desktop" "$userProfile\Desktop" --transfers 8 --drive-chunk-size 64M 2>$null
              $LASTEXITCODE = 0
            }
            if ($existingFolders -match "Documents") {
              Write-Host "Restoring Documents..." -ForegroundColor Green
              & C:\rclone\rclone.exe copy "gdrive:RDP_State/Documents" "$userProfile\Documents" --transfers 8 --drive-chunk-size 64M 2>$null
              $LASTEXITCODE = 0
            }
            if ($existingFolders -match "Downloads") {
              Write-Host "Restoring Downloads..." -ForegroundColor Green
              & C:\rclone\rclone.exe copy "gdrive:RDP_State/Downloads" "$userProfile\Downloads" --transfers 8 --drive-chunk-size 64M 2>$null
              $LASTEXITCODE = 0
            }
            if ($existingFolders -match "MyFiles") {
              Write-Host "Restoring MyFiles..." -ForegroundColor Green
              & C:\rclone\rclone.exe copy "gdrive:RDP_State/MyFiles" "C:\MyFiles" --transfers 8 --drive-chunk-size 64M 2>$null
              $LASTEXITCODE = 0
            }

            # بازیابی رجیستری در صورت وجود
            $hasReg = & C:\rclone\rclone.exe lsf "gdrive:RDP_State/user_settings.reg" 2>$null
            $LASTEXITCODE = 0
            if ($hasReg) {
              & C:\rclone\rclone.exe copy "gdrive:RDP_State/user_settings.reg" "$userProfile\" 2>$null
              $LASTEXITCODE = 0
              if (Test-Path "$userProfile\user_settings.reg") {
                reg import "$userProfile\user_settings.reg" 2>$null
              }
            }
          } else {
            Write-Host "First-time launch: No previous backup found in Google Drive. Starting fresh session." -ForegroundColor Yellow
          }

          $LASTEXITCODE = 0
          Write-Host "Desktop is ready. Current Desktop contents:" -ForegroundColor Green
          Get-ChildItem "$userProfile\Desktop" | Select-Object Name, Length

      # ۵. راه‌اندازی تونل ثابت Bore + تیل‌اسکیل (اختیاری)
      - name: 5. Connect Permanent Bore Tunnel & Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Setting up Permanent Bore Tunnel..." -ForegroundColor Cyan
          New-Item -ItemType Directory -Path "C:\bore" -Force | Out-Null
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "C:\bore\bore.zip"
          Expand-Archive -Path "C:\bore\bore.zip" -DestinationPath "C:\bore" -Force
          
          # اجرای Bore روی پورت دائمی ۳۸۹۲۶
          Start-Process -FilePath "C:\bore\bore.exe" -ArgumentList "local 3389 --to bore.pub --port 38926" -WorkingDirectory "C:\bore"

          # تیل‌اسکیل اختیاری (در صورت نبود سکرت، مرحله رد می‌شود)
          if ($env:TAILSCALE_AUTHKEY) {
            Write-Host "Tailscale key detected. Installing Tailscale..." -ForegroundColor Cyan
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
            Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
            Start-Sleep -Seconds 5
            & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="win-station" --unattended
          } else {
            Write-Host "Tailscale key not provided. Skipping (Optional)." -ForegroundColor Yellow
          }

          Write-Host ""
          Write-Host "=================================================================" -ForegroundColor Green
          Write-Host "  >>> 100% PERMANENT & STATIC RDP IS READY <<<" -ForegroundColor Cyan
          Write-Host "  👉 Fixed Address : bore.pub:38926" -ForegroundColor Yellow
          Write-Host "  👉 Username      : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  👉 Password      : Cynet@2026" -ForegroundColor Yellow
          Write-Host "=================================================================" -ForegroundColor Green

      # ۶. سیستم همگام‌سازی سریع و خودکار (هر ۳ دقیقه یک‌بار)
      - name: 6. Keep Alive & Periodic Background Sync (350 Minutes)
        run: |
          $syncMinutes = 3
          $totalMinutes = 350

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60

            if ($i % $syncMinutes -eq 0) {
              Write-Host "[$i/$totalMinutes] Running Fast Delta Sync to Google Drive..." -ForegroundColor Magenta

              # پیدا کردن مسیر دقیق دسکتاپ فعال کاربر
              $activeProfile = Get-ChildItem "C:\Users" | Where-Object { $_.Name -like "CynetAdmin*" } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              $pPath = if ($activeProfile) { $activeProfile.FullName } else { "C:\Users\CynetAdmin" }

              # سینک مستقیم و سریع فایل‌ها
              & C:\rclone\rclone.exe sync "$pPath\Desktop" "gdrive:RDP_State/Desktop" --transfers 8 --drive-chunk-size 64M 2>$null
              & C:\rclone\rclone.exe sync "$pPath\Documents" "gdrive:RDP_State/Documents" --transfers 8 --drive-chunk-size 64M 2>$null
              & C:\rclone\rclone.exe sync "$pPath\Downloads" "gdrive:RDP_State/Downloads" --transfers 8 --drive-chunk-size 64M 2>$null
              & C:\rclone\rclone.exe sync "C:\MyFiles" "gdrive:RDP_State/MyFiles" --transfers 8 --drive-chunk-size 64M 2>$null
              $LASTEXITCODE = 0
            } else {
              Write-Host "[$i/$totalMinutes] System running smoothly..."
            }
          }

      # ۷. بکاپ قطعی نهایی در لحظه بستن، اتمام زمان یا کنسل شدن دستی ورک‌فلو
      - name: 7. Final State Backup to Google Drive
        if: always()
        run: |
          Write-Host "Executing Final State Commit to Google Drive..." -ForegroundColor Cyan

          # تشخیص مسیر واقعی کاربر
          $activeProfile = Get-ChildItem "C:\Users" | Where-Object { $_.Name -like "CynetAdmin*" } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $pPath = if ($activeProfile) { $activeProfile.FullName } else { "C:\Users\CynetAdmin" }

          Write-Host "Backing up from: $pPath" -ForegroundColor Green

          # ذخیره مستقیم فایل‌ها در گوگل درایو
          & C:\rclone\rclone.exe sync "$pPath\Desktop" "gdrive:RDP_State/Desktop" --transfers 8 --drive-chunk-size 64M 2>$null
          & C:\rclone\rclone.exe sync "$pPath\Documents" "gdrive:RDP_State/Documents" --transfers 8 --drive-chunk-size 64M 2>$null
          & C:\rclone\rclone.exe sync "$pPath\Downloads" "gdrive:RDP_State/Downloads" --transfers 8 --drive-chunk-size 64M 2>$null
          & C:\rclone\rclone.exe sync "C:\MyFiles" "gdrive:RDP_State/MyFiles" --transfers 8 --drive-chunk-size 64M 2>$null

          # استخراج و ذخیره تنظیمات نرم‌افزارها در رجیستری
          reg export "HKCU\Software" "$pPath\user_settings.reg" /y 2>$null
          if (Test-Path "$pPath\user_settings.reg") {
            & C:\rclone\rclone.exe copy "$pPath\user_settings.reg" "gdrive:RDP_State" --drive-chunk-size 64M 2>$null
          }

          $LASTEXITCODE = 0
          Write-Host "All files committed to Google Drive successfully." -ForegroundColor Green

      # ۸. خروج ایمن از تیل‌اسکیل (در صورت اجرا بودن)
      - name: 8. Immediate Tailscale Logout
        if: always()
        run: |
          if (Test-Path "C:\Program Files\Tailscale\tailscale.exe") {
            try { & "C:\Program Files\Tailscale\tailscale.exe" logout } catch {}
          }

      # ۹. راه‌اندازی مجدد خودکار برای سشن پیوسته بعدی
      - name: 9. Trigger Next Run (Auto-Restart)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if ($env:GH_TOKEN) {
            Write-Host "Starting next continuous session..." -ForegroundColor Cyan
            gh workflow run "windows-rdp.yml" --repo $env:GITHUB_REPOSITORY --ref main
          } else {
            Write-Host "Auto-restart skipped (GH_PAT not provided)."
          }
