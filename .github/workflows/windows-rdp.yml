name: The New New Windows Build Environment

on:
  workflow_dispatch:

concurrency:
  group: rdp-environment
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Configure System & Remote Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Setup Local User
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      # دانلود و راه‌اندازی امن Rclone با گوگل درایو ۵ ترابایتی
      - name: 3. Initialize Google Drive Storage
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "C:\rclone.zip"
          Expand-Archive -Path "C:\rclone.zip" -DestinationPath "C:\rclone_temp"
          $rcloneDir = Get-ChildItem "C:\rclone_temp" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Move-Item -Path $rcloneDir.FullName -Destination "C:\rclone"

          $confPath = "$env:APPDATA\rclone\rclone.conf"
          New-Item -ItemType File -Path $confPath -Force
          [System.IO.File]::WriteAllBytes($confPath, [System.Convert]::FromBase64String($env:RCLONE_CONF_B64))
          
          Write-Host "Verifying Google Drive connection..." -ForegroundColor Cyan
          & C:\rclone\rclone.exe about gdrive:

      # مرحله ۴ اصلاح‌شده (بدون ارور در صورت نبود فایل قبلی)
      - name: 4. Restore Full User State
        run: |
          Write-Host "Checking for previous session in Google Drive..." -ForegroundColor Cyan
          $userProfile = "C:\Users\CynetAdmin"
          New-Item -ItemType Directory -Path "$userProfile\Desktop" -Force
          New-Item -ItemType Directory -Path "$userProfile\Downloads" -Force
          New-Item -ItemType Directory -Path "$userProfile\Documents" -Force
          New-Item -ItemType Directory -Path "C:\MyFiles" -Force

          # بررسی وجود فایل در گوگل درایو قبل از دانلود
          $remoteFile = & C:\rclone\rclone.exe lsf "gdrive:RDP_State/user_state.zip" 2>$null
          $LASTEXITCODE = 0

          if ($remoteFile) {
            Write-Host "Downloading user state from Google Drive..." -ForegroundColor Green
            & C:\rclone\rclone.exe copy "gdrive:RDP_State/user_state.zip" "C:\backup_temp" --drive-chunk-size 64M
            
            if (Test-Path "C:\backup_temp\user_state.zip") {
              Write-Host "Restoring user profile..." -ForegroundColor Green
              Expand-Archive -Path "C:\backup_temp\user_state.zip" -DestinationPath $userProfile -Force
              Remove-Item "C:\backup_temp\user_state.zip" -Force
              
              if (Test-Path "$userProfile\user_settings.reg") {
                Write-Host "Importing user registry settings..." -ForegroundColor Green
                reg import "$userProfile\user_settings.reg"
              }
            }
          } else {
            Write-Host "First-time launch: No previous backup found. Starting fresh session." -ForegroundColor Yellow
          }
          $LASTEXITCODE = 0

      - name: 5. Connect Tailscale Network
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="win-station"

          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> SEAMLESS RDP IS READY <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale Hostname : win-station" -ForegroundColor Yellow
          Write-Host "  Tailscale IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "  State Syncing      : Active & Continuous" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      # سیستم ناظر خودکار در پس‌زمینه (هر ۱۵ دقیقه تغییرات را آرام ذخیره می‌کند)
      - name: 6. Keep Alive & Periodic Background Sync (350 Minutes)
        run: |
          $userProfile = "C:\Users\CynetAdmin"
          $syncMinutes = 15
          $totalMinutes = 350

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60

            if ($i % $syncMinutes -eq 0) {
              Write-Host "[$i/$totalMinutes] Running periodic delta sync to Google Drive..." -ForegroundColor Magenta
              reg export "HKCU" "$userProfile\user_settings.reg" /y
              
              $itemsToBackup = @()
              if (Test-Path "$userProfile\Desktop") { $itemsToBackup += "$userProfile\Desktop" }
              if (Test-Path "$userProfile\Downloads") { $itemsToBackup += "$userProfile\Downloads" }
              if (Test-Path "$userProfile\Documents") { $itemsToBackup += "$userProfile\Documents" }
              if (Test-Path "$userProfile\AppData\Roaming") { $itemsToBackup += "$userProfile\AppData\Roaming" }
              if (Test-Path "$userProfile\AppData\Local\Google\Chrome\User Data") { $itemsToBackup += "$userProfile\AppData\Local\Google\Chrome\User Data" }
              if (Test-Path "$userProfile\AppData\Local\Programs") { $itemsToBackup += "$userProfile\AppData\Local\Programs" }
              if (Test-Path "$userProfile\user_settings.reg") { $itemsToBackup += "$userProfile\user_settings.reg" }
              if (Test-Path "C:\MyFiles") { $itemsToBackup += "C:\MyFiles" }

              if ($itemsToBackup.Count -gt 0) {
                Compress-Archive -Path $itemsToBackup -DestinationPath "C:\user_state.zip" -Force -ErrorAction SilentlyContinue
                if (Test-Path "C:\user_state.zip") {
                  & C:\rclone\rclone.exe copy "C:\user_state.zip" "gdrive:RDP_State" --drive-chunk-size 64M
                }
              }
            } else {
              Write-Host "[$i/$totalMinutes] System running smoothly..."
            }
          }

      # بکاپ قطعی و نهایی در لحظه پایان یا خاموشی
      - name: 7. Final State Backup to Google Drive
        if: always()
        run: |
          Write-Host "Triggering final state commit to Google Drive..." -ForegroundColor Cyan
          $userProfile = "C:\Users\CynetAdmin"
          reg export "HKCU" "$userProfile\user_settings.reg" /y
          
          $itemsToBackup = @()
          if (Test-Path "$userProfile\Desktop") { $itemsToBackup += "$userProfile\Desktop" }
          if (Test-Path "$userProfile\Downloads") { $itemsToBackup += "$userProfile\Downloads" }
          if (Test-Path "$userProfile\Documents") { $itemsToBackup += "$userProfile\Documents" }
          if (Test-Path "$userProfile\AppData\Roaming") { $itemsToBackup += "$userProfile\AppData\Roaming" }
          if (Test-Path "$userProfile\AppData\Local\Google\Chrome\User Data") { $itemsToBackup += "$userProfile\AppData\Local\Google\Chrome\User Data" }
          if (Test-Path "$userProfile\AppData\Local\Programs") { $itemsToBackup += "$userProfile\AppData\Local\Programs" }
          if (Test-Path "$userProfile\user_settings.reg") { $itemsToBackup += "$userProfile\user_settings.reg" }
          if (Test-Path "C:\MyFiles") { $itemsToBackup += "C:\MyFiles" }

          if ($itemsToBackup.Count -gt 0) {
            Compress-Archive -Path $itemsToBackup -DestinationPath "C:\user_state.zip" -Force -ErrorAction SilentlyContinue
            if (Test-Path "C:\user_state.zip") {
              & C:\rclone\rclone.exe copy "C:\user_state.zip" "gdrive:RDP_State" --drive-chunk-size 64M
              Write-Host "User state successfully committed to 5TB Google Drive." -ForegroundColor Green
            }
          }

      - name: 8. Immediate Tailscale Logout
        if: always()
        run: |
          Write-Host "Releasing Tailscale hostname..." -ForegroundColor Yellow
          if (Test-Path "C:\Program Files\Tailscale\tailscale.exe") {
            & "C:\Program Files\Tailscale\tailscale.exe" logout
          }

      # راه‌اندازی مجدد در صورت اتمام یا خطا
      - name: 9. Trigger Next Run (Auto-Restart)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          Write-Host "Starting next continuous session..." -ForegroundColor Cyan
          gh workflow run "windows-rdp.yml" --repo $env:GITHUB_REPOSITORY --ref main
