name: The New New Windows Build Environment

on:
  workflow_dispatch:

concurrency:
  group: rdp-environment
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Configure System & Remote Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Setup Local User
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      # دانلود و راه‌اندازی سریع Rclone با اکانت 5 ترابایتی گوگل
      - name: 3. Setup Google Drive Storage
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "C:\rclone.zip"
          Expand-Archive -Path "C:\rclone.zip" -DestinationPath "C:\rclone_temp"
          $rcloneDir = Get-ChildItem "C:\rclone_temp" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Move-Item -Path $rcloneDir.FullName -Destination "C:\rclone"

          $confPath = "$env:APPDATA\rclone\rclone.conf"
          New-Item -ItemType File -Path $confPath -Force
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:RCLONE_CONF_B64)) | Set-Content -Path $confPath

      # بازگردانی هویت کاربر (دسکتاپ، لاگین‌های مرورگر، برنامه‌ها و رجیستری)
      - name: 4. Restore User State from Google Drive
        run: |
          Write-Host "Restoring user session, desktop, and app logins..." -ForegroundColor Cyan
          $userProfile = "C:\Users\CynetAdmin"
          New-Item -ItemType Directory -Path "$userProfile\Desktop" -Force
          New-Item -ItemType Directory -Path "$userProfile\Downloads" -Force

          # دانلود بسته وضعیت کاربر از گوگل درایو در صورت وجود
          & C:\rclone\rclone.exe copy "gdrive:RDP_State/user_state.zip" "C:\temp_state" --drive-chunk-size 64M
          
          if (Test-Path "C:\temp_state\user_state.zip") {
            Expand-Archive -Path "C:\temp_state\user_state.zip" -DestinationPath $userProfile -Force
            Remove-Item "C:\temp_state\user_state.zip" -Force
            
            # بازگردانی تنظیمات رجیستری کاربر
            if (Test-Path "$userProfile\user_registry.reg") {
              reg import "$userProfile\user_registry.reg"
            }
          }

      - name: 5. Connect Tailscale Network
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="win-station"

          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> SERVER IS READY FOR USER <<<" -ForegroundColor Cyan
          Write-Host "  Connect Hostname   : win-station" -ForegroundColor Yellow
          Write-Host "  Tailscale IP       : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Desktop & Logins   : Fully Persistent & Synced" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      # اجرای سیستم ناظر همگام‌سازی دوره‌ای در پس‌زمینه (هر ۱۵ دقیقه)
      - name: 6. Keep Alive & Continuous Delta Sync (350 Minutes)
        run: |
          $userProfile = "C:\Users\CynetAdmin"
          $syncMinutes = 15
          $totalMinutes = 350

          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60

            # هر 15 دقیقه، تغییرات دسکتاپ و دیتای نرم‌افزارها را به صورت سایلنت به گوگل درایو می‌فرستد
            if ($i % $syncMinutes -eq 0) {
              Write-Host "[$i/$totalMinutes] Running periodic silent sync to Google Drive..." -ForegroundColor Magenta
              reg export "HKCU" "$userProfile\user_registry.reg" /y
              
              # ساخت بسته سریع بدون کش‌های موقت
              Compress-Archive -Path "$userProfile\Desktop", "$userProfile\Downloads", "$userProfile\AppData\Roaming", "$userProfile\AppData\Local\Google\Chrome\User Data", "$userProfile\user_registry.reg" -DestinationPath "C:\live_state.zip" -Force -ErrorAction SilentlyContinue
              if (Test-Path "C:\live_state.zip") {
                & C:\rclone\rclone.exe copy "C:\live_state.zip" "gdrive:RDP_State" --drive-chunk-size 64M
                Move-Item "C:\live_state.zip" "$userProfile\last_sync.zip" -Force
              }
            } else {
              Write-Host "[$i/$totalMinutes] Server running..."
            }
          }

      # بکاپ نهایی و قطعی در لحظه خروج یا خاموشی
      - name: 7. Final State Backup to Google Drive
        if: always()
        run: |
          Write-Host "Triggering final emergency shutdown backup..." -ForegroundColor Cyan
          $userProfile = "C:\Users\CynetAdmin"
          
          # ذخیره رجیستری
          reg export "HKCU" "$userProfile\user_registry.reg" /y
          
          # فشرده‌سازی فایل‌های جدید کاربر
          Compress-Archive -Path "$userProfile\Desktop", "$userProfile\Downloads", "$userProfile\AppData\Roaming", "$userProfile\AppData\Local\Google\Chrome\User Data", "$userProfile\user_registry.reg" -DestinationPath "C:\user_state.zip" -Force -ErrorAction SilentlyContinue
          
          if (Test-Path "C:\user_state.zip") {
            & C:\rclone\rclone.exe copy "C:\user_state.zip" "gdrive:RDP_State" --drive-chunk-size 64M
            Write-Host "Final state successfully committed to 5TB Google Drive." -ForegroundColor Green
          }

      - name: 8. Immediate Tailscale Logout
        if: always()
        run: |
          Write-Host "Releasing Tailscale hostname..." -ForegroundColor Yellow
          if (Test-Path "C:\Program Files\Tailscale\tailscale.exe") {
            & "C:\Program Files\Tailscale\tailscale.exe" logout
          }

      - name: 9. Trigger Next Run (Auto-Restart)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          Write-Host "Queueing next seamless run..." -ForegroundColor Cyan
          gh workflow run "windows-rdp.yml" --repo $env:GITHUB_REPOSITORY --ref main
